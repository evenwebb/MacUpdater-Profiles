name: Validate Profiles

on:
  push:
    paths:
      - '**.json'
      - 'scripts/**'
      - '.github/workflows/validate.yml'
  pull_request:
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Validate all profile JSON files
        run: python3 scripts/validate_profiles.py
      - name: Verify manifest is current
        run: |
          python3 scripts/generate_manifest.py
          if ! git diff --exit-code manifest.json; then
            echo "::error::manifest.json is out of date. Run: python3 scripts/generate_manifest.py"
            exit 1
          fi
      - name: Verify health badge JSON (if present)
        run: |
          if [ -f badges/health.json ]; then
            python3 -c 'import json; json.load(open("badges/health.json"))'
          fi

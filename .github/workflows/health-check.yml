name: Daily Profile Health Check

on:
  schedule:
    - cron: "0 6 * * *"  # 6am UTC daily
  workflow_dispatch:

concurrency:
  group: profile-health
  cancel-in-progress: true

permissions:
  contents: write
  issues: write

jobs:
  health-check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ secrets.GH_TOKEN }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Validate all profile JSON
        run: python3 scripts/validate_profiles.py

      - name: Check remote profile health (rotating batch)
        id: health
        run: |
          # Rotating batch: checks 40 profiles per day, complete cycle every 5 days.
          # 177 profiles ÷ 5 days ≈ 36/day. We use 40 to include new ones.
          # Runtime: ~40 × 3s ÷ 8 workers ≈ 15 seconds. Free on public repos.
          DAY=$(( ($(date +%j) - 1) % 5 ))   # 0-4 rotating daily
          OFFSET=$(( DAY * 40 ))
          echo "Batch $DAY: offset=$OFFSET limit=40"
          # If the Python script crashes, ensure we still create a file
          python3 scripts/validate_remote.py --offset "$OFFSET" --sample 40 --report > health-report.md || {
            echo "Health check script failed with exit code $?"
            echo "# Health Check Failed" > health-report.md
            echo "" >> health-report.md
            echo "The health check script encountered an error and could not complete." >> health-report.md
            echo "Check the [workflow run](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}) for details." >> health-report.md
          }
          echo "--- health-report.md ---"
          cat health-report.md
        continue-on-error: true

      - name: Generate health badge
        run: |
          mkdir -p badges
          python3 scripts/validate_remote.py --sample 30 --badge > badges/health.json

      - name: Commit health badge
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add badges/health.json
          if git diff --cached --quiet; then
            echo "No badge changes"
            exit 0
          fi
          git commit -m "Update profile health badge [skip ci]"
          git push

      - name: Open issue for broken profiles
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: |
          if [ ! -f health-report.md ]; then
            echo "No health-report.md found — script likely crashed before output" >> $GITHUB_STEP_SUMMARY
            exit 0
          fi
          REPORT=$(cat health-report.md)
          BROKEN=$(echo "$REPORT" | grep -c "BROKEN" || true)
          if [ "$BROKEN" -eq 0 ]; then
            echo "No broken profiles found" >> $GITHUB_STEP_SUMMARY
            exit 0
          fi
          TITLE="Profile health: ${BROKEN} broken profile(s)"
          # Find existing issue
          EXISTING=$(gh issue list --label "health-check" --state open --limit 5 --json number,title --jq '.[] | select(.title | startswith("Profile health:")) | .number' | head -1)
          if [ -n "$EXISTING" ]; then
            echo "$REPORT" | gh issue comment "$EXISTING" --body-file -
          else
            echo "$REPORT" | gh issue create --title "$TITLE" --label "health-check" --body-file -
          fi

      - name: Auto-close health issue if all clear
        if: success()
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: |
          ISSUES=$(gh issue list --label "health-check" --state open --limit 5 --json number,title --jq '.[] | select(.title | startswith("Profile health:")) | .number')
          for num in $ISSUES; do
            gh issue comment "$num" --body "✅ All profiles healthy again. Auto-closing."
            gh issue close "$num"
          done

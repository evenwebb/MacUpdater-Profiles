name: Daily Profile Health Check

on:
  schedule:
    - cron: "0 6 * * *"  # 6am UTC daily
  workflow_dispatch:

concurrency:
  group: profile-health
  cancel-in-progress: true

permissions:
  contents: write
  issues: write

jobs:
  health-check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # PAT (optional) for higher api.github.com limits; fall back so `gh` always auths.
      GH_TOKEN: ${{ secrets.GH_TOKEN || github.token }}
      GITHUB_TOKEN: ${{ secrets.GH_TOKEN || github.token }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Validate all profile JSON
        run: python3 scripts/validate_profiles.py

      - name: Check remote profile health (rotating batch)
        id: health
        run: |
          # Rotating batch: ~40 profiles/day, full cycle ~every 5–6 days.
          DAY=$(( ($(date +%j) - 1) % 5 ))
          OFFSET=$(( DAY * 40 ))
          echo "Batch $DAY: offset=$OFFSET limit=40"
          python3 scripts/validate_remote.py --offset "$OFFSET" --sample 40 --report > health-report.md
          echo "--- health-report.md ---"
          cat health-report.md
          if ! grep -q "Profile Health Report" health-report.md; then
            echo "Report missing expected header" >&2
            exit 1
          fi
          if grep -q "## Broken profiles" health-report.md; then
            echo "has_broken=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_broken=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Generate health badge
        run: |
          mkdir -p badges
          # Script writes badges/health.json itself (no shell redirect — avoids corruption).
          python3 scripts/validate_remote.py --sample 30 --badge
          python3 -c 'import json; json.load(open("badges/health.json")); print("badge ok:", open("badges/health.json").read())'

      - name: Commit health badge
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add badges/health.json
          if git diff --cached --quiet; then
            echo "No badge changes"
            exit 0
          fi
          git commit -m "Update profile health badge [skip ci]"
          git push

      - name: Open or update issue for broken profiles
        if: steps.health.outputs.has_broken == 'true'
        continue-on-error: true
        run: |
          REPORT=$(cat health-report.md)
          BROKEN=$(grep -c '^\- \*\*' health-report.md || true)
          TITLE="Profile health: ${BROKEN} broken profile(s)"
          EXISTING=$(gh issue list --label "health-check" --state open --limit 10 --json number,title \
            --jq '.[] | select(.title | startswith("Profile health:")) | .number' | head -1 || true)
          if [ -n "$EXISTING" ]; then
            gh issue comment "$EXISTING" --body "$REPORT"
          else
            # Label may not exist yet — create issue then add label best-effort.
            NUM=$(gh issue create --title "$TITLE" --body "$REPORT" | grep -oE '[0-9]+$')
            gh issue edit "$NUM" --add-label "health-check" || true
          fi

      - name: Auto-close health issue if all clear
        if: steps.health.outputs.has_broken == 'false'
        continue-on-error: true
        run: |
          ISSUES=$(gh issue list --label "health-check" --state open --limit 10 --json number,title \
            --jq '.[] | select(.title | startswith("Profile health:")) | .number' || true)
          for num in $ISSUES; do
            gh issue comment "$num" --body "✅ All profiles healthy again. Auto-closing."
            gh issue close "$num"
          done
